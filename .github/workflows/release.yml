name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для ручного релиза (например v2.3.0)'
        required: true

permissions:
  contents: write

jobs:
  # Версия вычисляется ОДИН раз и раздаётся всем целям: три плагина, собранные под
  # одним тегом, обязаны представляться серверу одним и тем же номером.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::не удалось вычислить версию из тега '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Тег $TAG -> версия $VERSION"

  cssharp:
    needs: version
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ch
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cssharp/ConnectHistory.sln

      - name: Build
        run: dotnet build cssharp/ConnectHistory.sln -c Release --no-restore -p:Version=$PLUGIN_VERSION

      # Релиз не уезжает, если тесты красные
      - name: Test
        env:
          CH_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test;database=ch"
        run: dotnet test cssharp/tests/ConnectHistory.Tests/ConnectHistory.Tests.csproj -c Release --no-build --verbosity normal

      # Свежие базы GeoLite2, если в репозитории задан секрет.
      # Без секрета в архив попадут закоммиченные копии из GeoIP/.
      - name: Package
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: dotnet build cssharp/ConnectHistory.csproj -c Release --no-incremental -p:Version=$PLUGIN_VERSION

      # В релиз уходит ТОЛЬКО полный архив — с базами GeoLite2 внутри.
      # Архив без них выглядит рабочим до первого игрока, у которого не определилась страна.
      - name: Verify artifact
        run: |
          set -euo pipefail
          ZIP="cssharp/bin/Release/net10.0/ConnectHistory_cssharp_${PLUGIN_VERSION}.zip"
          PLUGIN_DIR=addons/counterstrikesharp/plugins/ConnectHistory
          test -f "$ZIP" || { echo "::error::$ZIP не собран"; exit 1; }
          unzip -l "$ZIP"

          for required in \
            "$PLUGIN_DIR/ConnectHistory.dll" \
            "$PLUGIN_DIR/MySqlConnector.dll" \
            "$PLUGIN_DIR/MaxMind.GeoIP2.dll" \
            "$PLUGIN_DIR/GeoLite2-Country.mmdb" \
            "$PLUGIN_DIR/GeoLite2-City.mmdb"
          do
            unzip -l "$ZIP" | grep -q -F "$required" \
              || { echo "::error::в архиве нет $required"; exit 1; }
          done

          # Конфиг содержит пароль от базы и в релиз попадать не должен никогда
          if unzip -l "$ZIP" | grep -q -F 'Settings.json'; then
            echo "::error::в архиве оказался Settings.json — он содержит пароль"
            exit 1
          fi

      # Плагин должен представляться серверу ровно той версией, что стоит в теге.
      # ModuleVersion читает InformationalVersion, поэтому ищем её прямо в собранной DLL.
      - name: Verify plugin version matches tag
        run: |
          set -euo pipefail
          DLL=cssharp/bin/Release/net10.0/ConnectHistory.dll
          if grep -a -q -F "$PLUGIN_VERSION" "$DLL"; then
            echo "OK: версия $PLUGIN_VERSION зашита в $DLL"
          else
            echo "::error::в $DLL нет версии $PLUGIN_VERSION — ModuleVersion уедет мимо тега"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-cssharp
          path: cssharp/bin/Release/net10.0/ConnectHistory_cssharp_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  swiftly:
    needs: version
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ch
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore swiftly/ConnectHistory.sln

      - name: Build
        run: dotnet build swiftly/ConnectHistory.sln -c Release --no-restore -p:Version=$PLUGIN_VERSION

      # Релиз не уезжает, если тесты красные
      - name: Test
        env:
          CH_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test;database=ch"
        run: dotnet test swiftly/tests/ConnectHistory.Swiftly.Tests/ConnectHistory.Swiftly.Tests.csproj -c Release --no-build --verbosity normal

      - name: Package
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: dotnet build swiftly/ConnectHistory.csproj -c Release --no-incremental -p:Version=$PLUGIN_VERSION

      - name: Verify artifact
        run: |
          set -euo pipefail
          ZIP="swiftly/bin/Release/net10.0/ConnectHistory_swiftly_${PLUGIN_VERSION}.zip"
          PLUGIN_DIR=addons/swiftlys2/plugins/ConnectHistory
          test -f "$ZIP" || { echo "::error::$ZIP не собран"; exit 1; }
          unzip -l "$ZIP"

          for required in \
            "$PLUGIN_DIR/ConnectHistory.dll" \
            "$PLUGIN_DIR/MySqlConnector.dll" \
            "$PLUGIN_DIR/MaxMind.GeoIP2.dll" \
            "$PLUGIN_DIR/GeoLite2-Country.mmdb" \
            "$PLUGIN_DIR/GeoLite2-City.mmdb"
          do
            unzip -l "$ZIP" | grep -q -F "$required" \
              || { echo "::error::в архиве нет $required"; exit 1; }
          done

          # Сборки самого SwiftlyS2 предоставляет хост. Своя копия рядом с плагином —
          # это второй ISwiftlyCore в процессе и падение на первом же приведении типов.
          if unzip -l "$ZIP" | grep -q -F 'SwiftlyS2'; then
            echo "::error::в архиве оказались сборки SwiftlyS2 — их даёт хост"
            exit 1
          fi

          # Конфиг содержит пароль от базы и в релиз попадать не должен никогда
          if unzip -l "$ZIP" | grep -q -F 'Settings.json'; then
            echo "::error::в архиве оказался Settings.json — он содержит пароль"
            exit 1
          fi

      - name: Verify plugin version matches tag
        run: |
          set -euo pipefail
          DLL=swiftly/bin/Release/net10.0/ConnectHistory.dll
          if grep -a -q -F "$PLUGIN_VERSION" "$DLL"; then
            echo "OK: версия $PLUGIN_VERSION зашита в $DLL"
          else
            echo "::error::в $DLL нет версии $PLUGIN_VERSION — плагин представится серверу мимо тега"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-swiftly
          path: swiftly/bin/Release/net10.0/ConnectHistory_swiftly_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  # Ядро C++-цели проверяется без SDK и без MySQL — держим это отдельной
  # работой, чтобы падение здесь было сразу понятно чем вызвано.
  metamod-core:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Тесты ядра
        working-directory: metamod
        run: |
          make -f Makefile.tests -j"$(nproc)"
          ./build-tests/ch_tests

      # Конфиги для архива генерирует САМ плагин: dump_defaults зовёт тот же
      # ConfigService.LoadOrCreate, что и первый запуск на сервере. Отдельный
      # генератор рано или поздно разошёлся бы с настоящим, и разошёлся бы молча.
      - name: Дефолтные конфиги для архива
        working-directory: metamod
        run: |
          set -euo pipefail
          make -f Makefile.tests dump-defaults -j"$(nproc)"
          ./build-tests/dump_defaults configs-default
          ls -la configs-default

      - uses: actions/upload-artifact@v4
        with:
          name: metamod-configs
          path: metamod/configs-default
          if-no-files-found: error

  metamod-build:
    needs: [version, metamod-core]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
            container: ghcr.io/source2ze/build-containers:steamrt3
          - os: windows-latest
            slug: windows

    env:
      HL2SDKCS2: ${{ github.workspace }}/ConnectHistory/metamod/sdk
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ConnectHistory
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: ConnectHistory/metamod/sdk
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk-manifests
          path: ConnectHistory/metamod/hl2sdk-manifests

      - uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      # AMBuild ships inside the SteamRT3 image; only the Windows runner needs it.
      - uses: actions/checkout@v4
        if: matrix.os == 'windows-latest'
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools
          cd ambuild && python -m pip install .

      # Версия у всех трёх целей одна и берётся из тега. В C# её подставляет
      # MSBuild, здесь — генерируемый заголовок.
      - name: Stamp version
        shell: bash
        working-directory: ConnectHistory/metamod
        run: |
          set -euo pipefail
          cat > src/mm/version.h <<EOF
          // Сгенерировано CI из тега. Руками не править.
          #pragma once
          #define CH_VERSION "$PLUGIN_VERSION"
          EOF
          cat src/mm/version.h

      - name: Build mariadb-connector-c
        shell: bash
        working-directory: ConnectHistory/metamod
        run: |
          set -euo pipefail
          cmake -S vendor/mariadb-connector-c -B build-deps/mariadb \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_UNIT_TESTS=OFF \
                -DWITH_EXTERNAL_ZLIB=OFF \
                -DCLIENT_PLUGIN_DIALOG=OFF
          cmake --build build-deps/mariadb --config Release --target mariadbclient

          # mysql.h includes mariadb_version.h and ma_config.h, which CMake generates
          # into its binary directory - the shipped include/ alone is not enough.
          mkdir -p build-deps/include build-deps/lib
          for header in mariadb_version.h ma_config.h; do
            found=$(find build-deps/mariadb -name "$header" -print -quit)
            if [ -z "$found" ]; then
              echo "::error::CMake did not generate $header"
              exit 1
            fi
            cp "$found" build-deps/include/
          done

          # Without the static library the link fails much later with a far less
          # obvious message, so check it here.
          lib=$(find build-deps/mariadb \( -name 'libmariadbclient.a' -o -name 'mariadbclient.lib' \) -print -quit)
          if [ -z "$lib" ]; then
            echo "::error::static MariaDB client was not built"
            find build-deps/mariadb -name '*.a' -o -name '*.lib' | head -20
            exit 1
          fi
          cp "$lib" build-deps/lib/

          ls -la build-deps/lib build-deps/include

      - name: Build plugin
        shell: bash
        working-directory: ConnectHistory/metamod
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild

      - uses: actions/upload-artifact@v4
        with:
          name: metamod-tree-${{ matrix.slug }}
          path: ConnectHistory/metamod/build/package/cs2
          if-no-files-found: error

  # По архиву на ОС. Раньше обе лежали в одном файле: он весил вдвое больше нужного,
  # и половина его содержимого не могла запуститься на машине, куда его распаковали.
  metamod-package:
    needs: [version, metamod-build]
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: trees
          pattern: metamod-tree-*

      - uses: actions/download-artifact@v4
        with:
          name: metamod-configs
          path: configs-default

      - name: Zip per OS
        run: |
          set -euo pipefail

          declare -A BINARY=(
            [linux]="addons/ConnectHistory/bin/linuxsteamrt64/ConnectHistory.so"
            [windows]="addons/ConnectHistory/bin/win64/ConnectHistory.dll"
          )
          declare -A FOREIGN=(
            [linux]="addons/ConnectHistory/bin/win64"
            [windows]="addons/ConnectHistory/bin/linuxsteamrt64"
          )

          for slug in linux windows; do
            tree="trees/metamod-tree-$slug"
            test -d "$tree" || { echo "::error::нет дерева $tree"; exit 1; }

            # Конфиги кладём В АРХИВ, а не надеемся, что плагин создаст их сам:
            # каталог сервера бывает только для чтения, а без Settings.json плагин
            # работает вхолостую и в базу не пишет ничего.
            mkdir -p "$tree/addons/ConnectHistory/configs"
            cp -a configs-default/. "$tree/addons/ConnectHistory/configs/"

            ZIP="$PWD/ConnectHistory_metamod_${slug}_${PLUGIN_VERSION}.zip"
            (cd "$tree" && zip -rq "$ZIP" .)

            for required in \
              "${BINARY[$slug]}" \
              "addons/metamod/ConnectHistory.vdf" \
              "addons/ConnectHistory/configs/Settings.json" \
              "addons/ConnectHistory/configs/Messages.json" \
              "addons/ConnectHistory/GeoLite2-Country.mmdb" \
              "addons/ConnectHistory/GeoLite2-City.mmdb"
            do
              unzip -l "$ZIP" | grep -q -F "$required" \
                || { echo "::error::в архиве $slug нет $required"; exit 1; }
            done

            # Чужая ОС в архиве — это половина веса, которая никогда не запустится
            if unzip -l "$ZIP" | grep -q -F "${FOREIGN[$slug]}"; then
              echo "::error::в архиве $slug оказались бинарники другой ОС"
              exit 1
            fi

            # Путь внутри VDF — KeyValues, где обратный слэш начинает escape.
            # Собранный на Windows VDF с '\' указывает в никуда.
            vdf=$(unzip -p "$ZIP" addons/metamod/ConnectHistory.vdf)
            echo "$vdf"
            case "$vdf" in
              *'\'*) echo "::error::в VDF архива $slug обратные слэши"; exit 1 ;;
            esac

            # Шаблон конфига едет в релиз намеренно, но ТОЛЬКО с пустым паролем
            if unzip -p "$ZIP" addons/ConnectHistory/configs/Settings.json \
               | grep -qE '"Password"[[:space:]]*:[[:space:]]*"[^"]+"'; then
              echo "::error::в Settings.json архива $slug непустой пароль"
              exit 1
            fi
          done

          ls -la ConnectHistory_metamod_*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-metamod
          path: ConnectHistory_metamod_*_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    needs: [version, cssharp, swiftly, metamod-package]
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      # The release body comes from CHANGELOG.md: a short "added / fixed" beats an
      # automatic list of commits. No section means no release - quietly shipping a
      # version with no description is worse than failing here.
      - name: Compose release notes
        run: |
          set -euo pipefail

          python3 - "$PLUGIN_VERSION" > changelog-section.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          match = re.search(r'^## +' + re.escape(version) + r'\s*$(.*?)(?=^## |\Z)',
                            text, re.M | re.S)
          if match is None or not match.group(1).strip():
              sys.stderr.write(f'::error::CHANGELOG.md has no section for {version}\n')
              sys.exit(1)
          print(match.group(1).strip())
          PY

          {
            cat changelog-section.md
            echo
            echo "---"
            echo
            echo "Requires **MySQL 5.7 / 8.0+** (or MariaDB 10.4+)."
            echo
            echo "| Archive | Requirements |"
            echo "|---|---|"
            echo "| \`ConnectHistory_cssharp_${PLUGIN_VERSION}.zip\` | CounterStrikeSharp >= 1.0.369 (Metamod:Source) |"
            echo "| \`ConnectHistory_swiftly_${PLUGIN_VERSION}.zip\` | SwiftlyS2 >= 1.4.9 (Metamod not needed) |"
            echo "| \`ConnectHistory_metamod_${PLUGIN_VERSION}.zip\` | Metamod:Source (native; Windows + Linux in one archive) |"
            echo
            echo "Extract into the root of your game server. The plugin creates its configs and"
            echo "database tables on first run: fill in the \`Database\` section of \`Settings.json\`"
            echo "and reload the configuration."
            echo
            echo "Schema and query cookbook: [docs/DATABASE.md](docs/DATABASE.md)."
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/*.zip
