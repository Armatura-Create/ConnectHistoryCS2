name: CI (SwiftlyS2)

# Фильтр по путям: правка только в cssharp/ или metamod/ не должна гонять эту сборку.
# Обратная сторона — PR, не трогающий swiftly/, не даст здесь ни одного статуса;
# если когда-нибудь включим branch protection, этот чек обязательным делать нельзя.
#
# runs-on обязан быть x64: сборка SwiftlyS2.CS2 собрана только под эту архитектуру
# (выделенный сервер CS2 другой не бывает), и на arm64-раннере часть тестов
# честно пропустится вместо того, чтобы что-то проверить.
on:
  push:
    branches: [main]
    paths:
      - 'swiftly/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-swiftly.yml'
  pull_request:
    paths:
      - 'swiftly/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-swiftly.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Интеграционные тесты гоняются против настоящей MySQL: схема, идемпотентность
    # закрытия сессии и хранение времени в UTC на моках не проверяются.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ch
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore swiftly/ConnectHistory.sln

      - name: Build
        run: dotnet build swiftly/ConnectHistory.sln -c Release --no-restore

      - name: Test
        env:
          CH_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test;database=ch"
        run: dotnet test swiftly/tests/ConnectHistory.Swiftly.Tests/ConnectHistory.Swiftly.Tests.csproj -c Release --no-build --verbosity normal
