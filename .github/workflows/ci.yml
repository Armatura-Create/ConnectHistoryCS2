name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Интеграционные тесты гоняются против настоящей MySQL: схема, идемпотентность
    # закрытия сессии и хранение времени в UTC на моках не проверяются.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ch
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ConnectHistory.sln

      - name: Build
        run: dotnet build ConnectHistory.sln -c Release --no-restore

      - name: Test
        env:
          CH_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test;database=ch"
        run: dotnet test tests/ConnectHistory.Tests/ConnectHistory.Tests.csproj -c Release --no-build --verbosity normal
