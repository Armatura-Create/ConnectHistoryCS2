name: CI (CounterStrikeSharp)

# Фильтр по путям: правка только в swiftly/ или metamod/ не должна гонять эту сборку.
# Обратная сторона — PR, не трогающий cssharp/, не даст здесь ни одного статуса;
# если когда-нибудь включим branch protection, этот чек обязательным делать нельзя.
on:
  push:
    branches: [main]
    paths:
      - 'cssharp/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-cssharp.yml'
  pull_request:
    paths:
      - 'cssharp/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-cssharp.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Интеграционные тесты гоняются против настоящей MySQL: схема, идемпотентность
    # закрытия сессии и хранение времени в UTC на моках не проверяются.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ch
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cssharp/ConnectHistory.sln

      - name: Build
        run: dotnet build cssharp/ConnectHistory.sln -c Release --no-restore

      - name: Test
        env:
          CH_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test;database=ch"
        run: dotnet test cssharp/tests/ConnectHistory.Tests/ConnectHistory.Tests.csproj -c Release --no-build --verbosity normal
