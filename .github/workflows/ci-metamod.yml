name: CI (Metamod:Source)

# Path filter: a C++ build with hl2sdk and protobufs takes minutes, and running it
# for a change in cssharp/ or swiftly/ is pointless.
on:
  push:
    branches: [main]
    paths:
      - 'metamod/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-metamod.yml'
  pull_request:
    paths:
      - 'metamod/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-metamod.yml'
  workflow_dispatch:

jobs:
  # The plugin core knows nothing about hl2sdk or MySQL, so it builds with a plain
  # compiler in seconds. Every invariant lives here: idempotent session close, the
  # spool, address parsing, chat colours, opening .mmdb from memory.
  core:
    name: Core (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # AMBuild reads build scripts with the locale default encoding, which is
      # cp1252 on the Windows runner: one non-ASCII byte fails configure with
      # UnicodeDecodeError. Cheaper to catch here than after a ten-minute build.
      - name: Build scripts must be ASCII
        working-directory: metamod
        run: |
          set -euo pipefail
          for f in AMBuildScript AMBuilder PackageScript configure.py; do
            python3 - "$f" <<'PY'
          import sys
          name = sys.argv[1]
          data = open(name, 'rb').read()
          try:
              data.decode('ascii')
          except UnicodeDecodeError as e:
              line = data[:e.start].count(b'\n') + 1
              sys.exit(f'::error file={name},line={line}::non-ASCII byte; '
                       f'AMBuild cannot read this on the Windows runner')
          PY
          done
          echo "all build scripts are ASCII"

      - name: Core tests
        working-directory: metamod
        run: |
          make -f Makefile.tests -j"$(nproc)"
          ./build-tests/ch_tests

      # The game build uses -fno-exceptions (all of hl2sdk does) and -std=c++20,
      # while the tests need exceptions (doctest does) and build as c++17. In the
      # -fno-exceptions mode nlohmann/json calls std::abort() instead of throwing,
      # so a broken config would kill the server instead of falling back to defaults.
      # This compile-only pass closes both gaps at once.
      - name: Core compiles as the game build does
        working-directory: metamod
        run: make -f Makefile.tests noexcept-check

  # Building the plugin itself. Linux builds inside the Steam Runtime 3 container:
  # that is the ABI a CS2 dedicated server uses, and a binary from a plain ubuntu
  # runner will not load.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (SteamRT3)
            container: ghcr.io/source2ze/build-containers:steamrt3
          - os: windows-latest
            name: Windows

    env:
      HL2SDKCS2: ${{ github.workspace }}/ConnectHistory/metamod/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ConnectHistory
          submodules: recursive
          fetch-depth: 0

      # hl2sdk and the manifests come from checkout rather than a submodule: a
      # submodule would drag gigabytes of SDK history into this repository forever.
      - name: Checkout hl2sdk (cs2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: ConnectHistory/metamod/sdk
          submodules: recursive

      - name: Checkout hl2sdk-manifests
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk-manifests
          path: ConnectHistory/metamod/hl2sdk-manifests

      - name: Checkout Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      # AMBuild ships inside the SteamRT3 image; only the Windows runner needs it.
      # Installing it unconditionally fails there - that python has no pip at all.
      - name: Checkout AMBuild
        if: matrix.os == 'windows-latest'
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools
          cd ambuild && python -m pip install .

      # The MariaDB client is linked statically: a game server must not depend on
      # whether libmariadb is installed system-wide, nor on which version it is.
      - name: Build mariadb-connector-c
        shell: bash
        working-directory: ConnectHistory/metamod
        run: |
          set -euo pipefail
          cmake -S vendor/mariadb-connector-c -B build-deps/mariadb \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_UNIT_TESTS=OFF \
                -DWITH_EXTERNAL_ZLIB=OFF \
                -DCLIENT_PLUGIN_DIALOG=OFF
          cmake --build build-deps/mariadb --config Release --target mariadbclient

          # mysql.h includes mariadb_version.h and ma_config.h, which CMake generates
          # into its binary directory - the shipped include/ alone is not enough.
          mkdir -p build-deps/include build-deps/lib
          for header in mariadb_version.h ma_config.h; do
            found=$(find build-deps/mariadb -name "$header" -print -quit)
            if [ -z "$found" ]; then
              echo "::error::CMake did not generate $header"
              exit 1
            fi
            cp "$found" build-deps/include/
          done

          # Without the static library the link fails much later with a far less
          # obvious message, so check it here.
          lib=$(find build-deps/mariadb \( -name 'libmariadbclient.a' -o -name 'mariadbclient.lib' \) -print -quit)
          if [ -z "$lib" ]; then
            echo "::error::static MariaDB client was not built"
            find build-deps/mariadb -name '*.a' -o -name '*.lib' | head -20
            exit 1
          fi
          cp "$lib" build-deps/lib/

          ls -la build-deps/lib build-deps/include

      - name: Build plugin
        shell: bash
        working-directory: ConnectHistory/metamod
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metamod-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
          path: ConnectHistory/metamod/build/package/cs2
          if-no-files-found: error
